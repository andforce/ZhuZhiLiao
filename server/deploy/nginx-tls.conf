map $http_upgrade $zhuzhiliao_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=zhuzhiliao_stats:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=zhuzhiliao_clients:10m;

server {
    listen 80;
    listen [::]:80;
    server_name zhuzhiliao.aimfor.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhuzhiliao.aimfor.top;

    ssl_certificate /etc/letsencrypt/live/zhuzhiliao.aimfor.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhuzhiliao.aimfor.top/privkey.pem;
    ssl_session_cache shared:ZhuZhiLiaoTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location = /api/ws {
        limit_conn zhuzhiliao_clients 50;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zhuzhiliao_connection_upgrade;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
        proxy_buffering off;
    }

    location = /api/stats {
        limit_req zone=zhuzhiliao_stats burst=20 nodelay;
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
