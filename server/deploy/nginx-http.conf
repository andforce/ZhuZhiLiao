map $http_upgrade $zhuzhiliao_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name zhuzhiliao.aimfor.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /api/ws {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zhuzhiliao_connection_upgrade;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
        proxy_buffering off;
    }

    location = /api/stats {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
