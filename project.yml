name: ZhuZhiLiao

options:
  bundleIdPrefix: com.azhegezhege
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ZhuZhiLiao:
    type: application
    platform: iOS
    sources:
      - path: ZhuZhiLiao
    info:
      path: ZhuZhiLiao/Info.plist
      properties:
        CFBundleDisplayName: 竹知了
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        NSMotionUsageDescription: 运动数据仅用于在本机识别手机摇动并控制竹知了，不会上传。
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azhegezhege.zhuzhiliao
        PRODUCT_NAME: 竹知了
        PRODUCT_MODULE_NAME: ZhuZhiLiao
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "202608030945"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: RH9H7T7RBU
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Development
          PROVISIONING_PROFILE_SPECIFIER: ZhuZhiLiao iPhone15pro Development

  ZhuZhiLiaoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZhuZhiLiaoTests
    dependencies:
      - target: ZhuZhiLiao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azhegezhege.zhuzhiliao.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/竹知了.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/竹知了"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ZhuZhiLiao:
    build:
      targets:
        ZhuZhiLiao: all
        ZhuZhiLiaoTests: [test]
    test:
      targets:
        - ZhuZhiLiaoTests
      gatherCoverageData: true
