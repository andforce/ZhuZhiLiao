<script>
'use strict';
/* ============================================================
   竹蝉 —— 传统玩具模拟
   物理：甩杆(指针) → 绳系竹筒(质点, 重力+弹性绳+阻力)
   声学：首选真实竹蝉录音采样(转速驱动回放速率)；
         解码失败回退合成链(锯齿波→调幅→扫频带通→共振峰)
   ============================================================ */

// roundRect 需 Safari 16+/Chrome 99+，旧内核补一个 arcTo 实现避免整页崩掉
if(!('roundRect' in CanvasRenderingContext2D.prototype)){
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){
    r = Math.min(Math.abs(+r) || 0, w/2, h/2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const FONT = '"Songti SC","Noto Serif SC","Noto Serif CJK SC","STSong","SimSun",serif';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

/* ---------- 玩具参数 ---------- */
let ROPE_LEN = 150;       // 绳长 px（随屏幕尺寸调整）
let AUTO_R   = 58;        // 自动甩画圈半径（随屏幕尺寸调整）
const ROPE_K   = 2600;    // 绳弹性 (加速度/px)
const ROPE_D   = 14;      // 绳径向阻尼
const GRAV     = 1150;    // 重力 px/s^2
const AIR_DRAG = 0.35;    // 空气阻力系数

/* ---------- 状态 ---------- */
const stick  = { x: 0, y: 0 };            // 甩杆杆梢
const target = { x: 0, y: 0 };            // 指针目标
const tube   = { x: 0, y: 0, vx: 0, vy: 0 }; // 竹筒(质点)
const pointer = { down: false, id: null, lift: 0 };  // lift: 触摸时锚点上移量
const auto = { on: false, rps: 0, phase: 0, cx: 0, cy: 0 };
let interacted = false;                   // 玩家是否已上手

function recenterToy(){
  target.x = stick.x = W*0.5;
  target.y = stick.y = H*0.42;
  tube.x = stick.x + 8;
  tube.y = stick.y + ROPE_LEN*0.92;
  tube.vx = 34; tube.vy = 0;
  prevTheta = Math.atan2(tube.y - stick.y, tube.x - stick.x);
}

let theta = 0, prevTheta = 0, omega = 0;  // 绳方向角与角速度
let ropeDist = ROPE_LEN, taut = 0;
let rps = 0, drive = 0, active = 0;       // 声音驱动量 0~1
let singTime = 0, hintGone = false;
let idleTime = 0;                         // 完全静置的累计时长
let revAccum = 0;                         // 手动甩的角度累计(每 2π 记一哇)
let needSoundTime = 0;                    // "想出声却出不了"的持续时长

/* ---------- 场景缓存(随 resize 重建为离屏层，避免每帧全屏静态重绘) ---------- */
let bgLayer = null, moonBambooLayer = null, fgLayer = null;
let stars = [], flies = [];
let grainTile = null;
let stickGrad = null, tubeGrad = null;    // 玩具渐变(局部坐标恒定，只建一次)

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function resize(){
  // 面板折叠/键盘弹出/嵌入环境会瞬时报 0：直接跳过本次，等尺寸恢复再重建，
  // 否则 1×1 的画布会把玩具永久夹到左上角（interacted 后不再回中）
  if(!(window.innerWidth > 0 && window.innerHeight > 0)) return;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // 移动端优先：小屏上绳更短、圈更小，拇指画小圈就能甩起来，
  // 且自动甩轨道(绳长+拉伸+圈半径)不出屏
  const minDim = Math.min(W, H);
  ROPE_LEN = clamp(minDim*0.28, 90, 220);
  AUTO_R   = clamp(minDim*0.13, 38, 85);

  // 玩家还没上手时，窗口变化就把玩具重新挂回屏幕中央
  if(!interacted) recenterToy();
  else { target.x = clamp(target.x, 0, W); target.y = clamp(target.y, 0, H); }

  // 旋屏/缩放后自动甩圆心重新钳制，避免玩具整体转出屏幕
  if(auto.on){
    auto.cx = clamp(auto.cx, W*0.28, W*0.72);
    auto.cy = clamp(auto.cy, H*0.26, H*0.6);
  }

  const rnd = mulberry32(2024);
  stars = [];
  for(let i = 0; i < 110; i++){
    stars.push({ x: rnd()*W, y: rnd()*H*0.72, r: 0.5 + rnd()*1.1,
                 a: 0.15 + rnd()*0.55, ph: rnd()*TAU, sp: 0.4 + rnd()*1.2 });
  }
  flies = [];
  const currentTheme = document.documentElement.getAttribute('data-theme') || 'autumn';
  if(currentTheme === 'summer'){
    for(let i = 0; i < 12; i++){
      flies.push({ x: rnd()*W, y: H*(0.45 + rnd()*0.5),
                   vx: (rnd()-0.5)*22, vy: (rnd()-0.5)*12,
                   ph: rnd()*TAU, sp: 0.8 + rnd()*1.4, type: 'firefly' });
    }
  } else if(currentTheme === 'spring'){
    for(let i = 0; i < 18; i++){
      flies.push({ x: rnd()*W, y: -rnd()*H,
                   vx: (rnd()-0.5)*8, vy: 20 + rnd()*30,
                   ph: rnd()*TAU, sp: 0.3 + rnd()*0.5, type: 'petal' });
    }
  } else if(currentTheme === 'autumn'){
    for(let i = 0; i < 16; i++){
      flies.push({ x: rnd()*W, y: -rnd()*H,
                   vx: (rnd()-0.5)*12, vy: 25 + rnd()*40,
                   ph: rnd()*TAU, sp: 0.3 + rnd()*0.6, type: 'leaf' });
    }
  } else {
    for(let i = 0; i < 24; i++){
      flies.push({ x: rnd()*W, y: -rnd()*H,
                   vx: (rnd()-0.5)*6, vy: 15 + rnd()*20,
                   ph: rnd()*TAU, sp: 0.2 + rnd()*0.4, type: 'snow' });
    }
  }
  buildBgLayer();
  buildMoonBambooLayer();
  buildFgLayer();
  if(typeof toy3d !== 'undefined' && toy3d) toy3d.resize(W, H, DPR, toyScale());
}

function newLayer(){
  const c = document.createElement('canvas');
  c.width = W * DPR; c.height = H * DPR;
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  return [c, g];
}

/* 背景层：天空三段渐变 + 地平线大气雾 */
function buildBgLayer(){
  const [c, b] = newLayer();
  const cs = getComputedStyle(document.documentElement);
  const sky = b.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0,    cs.getPropertyValue('--sky-top').trim() || '#130511');
  sky.addColorStop(0.58, cs.getPropertyValue('--sky-mid').trim() || '#3E120B');
  sky.addColorStop(1,    cs.getPropertyValue('--sky-bot').trim() || '#7A3414');
  b.fillStyle = sky; b.fillRect(0, 0, W, H);
  const glowRgb = cs.getPropertyValue('--glow-rgb').trim() || '219,99,31';
  const haze = b.createRadialGradient(W*0.5, H*0.70, 0, W*0.5, H*0.70, H*0.50);
  haze.addColorStop(0, `rgba(${glowRgb},0.12)`);
  haze.addColorStop(1, `rgba(${glowRgb},0)`);
  b.fillStyle = haze; b.fillRect(0, 0, W, H);
  bgLayer = c;
}

/* 月亮 + 季节剪影层（匹配 iOS Shaders.metal seasonalScene） */
function buildMoonBambooLayer(){
  const [c, b] = newLayer();
  const cs = getComputedStyle(document.documentElement);
  const theme = (document.documentElement.getAttribute('data-theme') || 'autumn');

  const silhouetteColor = cs.getPropertyValue('--bamboo-stalk').trim() || 'rgba(19,5,5,0.92)';
  const accentRgb = cs.getPropertyValue('--glow-rgb').trim() || '219,99,31';

  if(theme === 'spring'){
    // 春：薄日 + 柳影
    const sx = W*0.79, sy = H*0.20;
    const sunGlow = b.createRadialGradient(sx, sy, 8, sx, sy, 120);
    sunGlow.addColorStop(0, `rgba(${accentRgb},0.12)`);
    sunGlow.addColorStop(1, `rgba(${accentRgb},0)`);
    b.fillStyle = sunGlow; b.beginPath(); b.arc(sx, sy, 120, 0, TAU); b.fill();
    b.fillStyle = 'rgba(240,214,163,0.82)';
    b.beginPath(); b.arc(sx, sy, 28, 0, TAU); b.fill();

    function softStroke(x1,y1,x2,y2,w){
      b.save(); b.strokeStyle = silhouetteColor; b.lineWidth = w; b.lineCap = 'round';
      b.beginPath(); b.moveTo(x1,y1); b.lineTo(x2,y2); b.stroke(); b.restore();
    }
    softStroke(W*-0.03, H*0.05, W*0.18, H*0.37, 7);
    softStroke(W*0.06,  H*0.18, W*0.11, H*0.54, 3);
    softStroke(W*0.13,  H*0.26, W*0.22, H*0.58, 2);
    softStroke(W*1.02,  H*0.02, W*0.88, H*0.31, 5);

  } else if(theme === 'summer'){
    // 夏：弯月 + 竹影
    const mx = W*0.80, my = H*0.18;
    const moonGlow = b.createRadialGradient(mx, my, 4, mx, my, 120);
    moonGlow.addColorStop(0, `rgba(${accentRgb},0.12)`);
    moonGlow.addColorStop(0.4, `rgba(${accentRgb},0.05)`);
    moonGlow.addColorStop(1,   `rgba(${accentRgb},0)`);
    b.fillStyle = moonGlow; b.beginPath(); b.arc(mx, my, 120, 0, TAU); b.fill();
    b.fillStyle = 'rgba(240,230,179,0.90)';
    b.beginPath(); b.arc(mx, my, 28, 0, TAU); b.fill();
    b.fillStyle = cs.getPropertyValue('--sky-top').trim() || '#010E18';
    b.beginPath(); b.arc(mx + 9, my - 7, 24, 0, TAU); b.fill();

    function softStroke(x1,y1,x2,y2,w){
      b.save(); b.strokeStyle = silhouetteColor; b.lineWidth = w; b.lineCap = 'round';
      b.beginPath(); b.moveTo(x1,y1); b.lineTo(x2,y2); b.stroke(); b.restore();
    }
    softStroke(W*-0.02, H*1.04, W*0.10, H*0.42, 10);
    softStroke(W*0.055, H*0.66, W*0.20, H*0.56, 4);
    softStroke(W*1.02,  H*1.02, W*0.93, H*0.47, 9);
    softStroke(W*0.96,  H*0.67, W*0.83, H*0.58, 4);

  } else if(theme === 'autumn'){
    // 秋：大满月 + 层叠山脊
    const mx = W*0.77, my = H*0.22;
    const moonGlow = b.createRadialGradient(mx, my, 6, mx, my, 150);
    moonGlow.addColorStop(0, `rgba(${accentRgb},0.16)`);
    moonGlow.addColorStop(0.3, `rgba(${accentRgb},0.06)`);
    moonGlow.addColorStop(1,   `rgba(${accentRgb},0)`);
    b.fillStyle = moonGlow; b.beginPath(); b.arc(mx, my, 150, 0, TAU); b.fill();
    b.fillStyle = cs.getPropertyValue('--moon-face').trim() || '#fab447';
    b.beginPath(); b.arc(mx, my, 46, 0, TAU); b.fill();

    // 远山
    b.fillStyle = silhouetteColor.replace(/[\d.]+\)$/, (m) => (parseFloat(m)*1.7).toFixed(2)+')').replace('0.92','1.00');
    b.beginPath(); b.moveTo(0, H);
    for(let x = 0; x <= W; x += 2){
      const nx = x / W;
      const y = H * (0.77 + Math.sin(nx*8+0.6)*0.035 + Math.sin(nx*17)*0.018);
      b.lineTo(x, y);
    }
    b.lineTo(W, H); b.closePath(); b.fill();

    // 近山
    b.fillStyle = silhouetteColor;
    b.beginPath(); b.moveTo(0, H);
    for(let x = 0; x <= W; x += 2){
      const nx = x / W;
      const y = H * (0.86 + Math.sin(nx*6+2.1)*0.055 + Math.sin(nx*13)*0.022);
      b.lineTo(x, y);
    }
    b.lineTo(W, H); b.closePath(); b.fill();

  } else {
    // 冬：冷月 + 疏枝
    const mx = W*0.82, my = H*0.19;
    const moonGlow = b.createRadialGradient(mx, my, 4, mx, my, 120);
    moonGlow.addColorStop(0, `rgba(${accentRgb},0.14)`);
    moonGlow.addColorStop(0.4, `rgba(${accentRgb},0.05)`);
    moonGlow.addColorStop(1,   `rgba(${accentRgb},0)`);
    b.fillStyle = moonGlow; b.beginPath(); b.arc(mx, my, 120, 0, TAU); b.fill();
    b.fillStyle = cs.getPropertyValue('--moon-face').trim() || '#f0e9d8';
    b.beginPath(); b.arc(mx, my, 30, 0, TAU); b.fill();

    function softStroke(x1,y1,x2,y2,w){
      b.save(); b.strokeStyle = silhouetteColor; b.lineWidth = w; b.lineCap = 'round';
      b.beginPath(); b.moveTo(x1,y1); b.lineTo(x2,y2); b.stroke(); b.restore();
    }
    softStroke(W*-0.02, H*1.06, W*0.06,  H*0.42, 8);
    softStroke(W*0.052, H*0.68, W*0.18,  H*0.58, 5);
    softStroke(W*0.020, H*0.82, W*-0.045, H*0.75, 3);
    softStroke(W*1.03,  H*1.06, W*0.955, H*0.44, 7);
    softStroke(W*0.973, H*0.69, W*0.86,  H*0.59, 4);
  }

  moonBambooLayer = c;
}

/* 前景层：暗角 + 胶片颗粒 */
function buildFgLayer(){
  if(!grainTile){
    grainTile = document.createElement('canvas');
    grainTile.width = grainTile.height = 128;
    const g = grainTile.getContext('2d');
    const img = g.createImageData(128, 128);
    const rnd = mulberry32(99);
    for(let i = 0; i < img.data.length; i += 4){
      const v = rnd()*255 | 0;
      img.data[i] = img.data[i+1] = img.data[i+2] = v;
      img.data[i+3] = 7;
    }
    g.putImageData(img, 0, 0);
  }
  const [c, b] = newLayer();
  const vig = b.createRadialGradient(W*0.5, H*0.46, Math.min(W,H)*0.35, W*0.5, H*0.5, Math.max(W,H)*0.75);
  vig.addColorStop(0, 'rgba(5,6,16,0)');
  vig.addColorStop(1, 'rgba(5,6,16,0.55)');
  b.fillStyle = vig; b.fillRect(0, 0, W, H);
  b.fillStyle = b.createPattern(grainTile, 'repeat');
  b.fillRect(0, 0, W, H);
  fgLayer = c;
}

const RECORDED_RPS = 2.33;      // 录音里玩具的甩速(圈/秒)，由包络自相关测得
let AC = null, au = null;       // au.mode: null(加载中) | 'sample' | 'synth'

// 音频心跳：iOS 从后台切回后，上下文可能"状态 running 却无声"
// (currentTime 停走，输出管线已被系统回收)，这种僵尸只能拆掉重建
let acTimeLast = 0, acAdvanceWall = 0;
let acRebuilds = [];            // 最近自动重建时间戳：限频，防拆建循环
let sampleBytes = null;         // base64 只解一次，重建时复用
function audioStalled(){
  return !!AC && AC.state === 'running' && !document.hidden
      && acAdvanceWall > 0 && performance.now() - acAdvanceWall > 1500;
}

function ensureAudio(fromGesture){
  if(AC && (AC.state === 'closed' || audioStalled())){
    const now = performance.now();
    acRebuilds = acRebuilds.filter(ts => now - ts < 60000);
    if(!fromGesture && acRebuilds.length >= 3) return;   // 无手势自动重建 60s 限 3 次
    acRebuilds.push(now);
    try{ AC.close(); }catch(_){}
    AC = null; au = null;
    acTimeLast = 0; acAdvanceWall = 0;
  }
  if(AC){
    // 'suspended' 与 iOS 非标准的 'interrupted' 一并恢复
    if(AC.state !== 'running') AC.resume().catch(() => {});
    return;
  }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return;
  AC = new Ctx();
  AC.resume().catch(() => {});
  acTimeLast = 0; acAdvanceWall = performance.now();

  // 公共输出链：总闸 → 压限 → 分析器 → 扬声器
  const master = AC.createGain(); master.gain.value = 0;
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 8;
  comp.attack.value = 0.004; comp.release.value = 0.18;
  const analyser = AC.createAnalyser(); analyser.fftSize = 1024;
  master.connect(comp); comp.connect(analyser); analyser.connect(AC.destination);
  au = { master, analyser, mode: null };

  // 解码内嵌录音；任何一步失败都回退合成
  try{
    if(!sampleBytes){
      const bin = atob(ZZL_SAMPLE);
      sampleBytes = new Uint8Array(bin.length);
      for(let i = 0; i < bin.length; i++) sampleBytes[i] = bin.charCodeAt(i);
    }
    // decodeAudioData 会 detach 传入的 buffer，给副本以便重建时复用
    AC.decodeAudioData(sampleBytes.slice().buffer,
      buf => startSampleVoice(buf),
      () => startSynthVoice());
  }catch(_){ startSynthVoice(); }
}

/* 采样声部：把录音尾部 50ms 等功率交叉淡化烘进头部，做成无缝循环 */
function startSampleVoice(buf){
  if(!AC || !au || au.mode) return;
  const sr = buf.sampleRate;
  const F = Math.floor(sr*0.05);
  const loopLen = buf.length - F;
  if(loopLen <= sr*0.2){ startSynthVoice(); return; }
  const loop = AC.createBuffer(1, loopLen, sr);
  const s = buf.getChannelData(0), d = loop.getChannelData(0);
  d.set(s.subarray(0, loopLen));
  for(let i = 0; i < F; i++){
    const p = Math.PI/2 * i/F;
    d[i] = s[i]*Math.sin(p) + s[loopLen + i]*Math.cos(p);
  }
  const src = AC.createBufferSource();
  src.buffer = loop; src.loop = true;
  src.connect(au.master);
  src.start();
  au.sample = src;
  au.mode = 'sample';
}

/* 合成声部（兜底）：黏滑摩擦脉冲 → 调幅 → 扫频带通 → 膜腔共振峰 */
function startSynthVoice(){
  if(!AC || !au || au.mode) return;
  const t = AC.currentTime;

  const osc = AC.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.value = 70;
  const shaper = AC.createWaveShaper();
  {
    const n = 1024, curve = new Float32Array(n);
    for(let i = 0; i < n; i++){
      const x = i/(n - 1)*2 - 1;
      curve[i] = Math.tanh(x*3.2);
    }
    shaper.curve = curve;
    shaper.oversample = '2x';
  }
  osc.connect(shaper);

  const am = AC.createGain(); am.gain.value = 0.62;
  const lfo = AC.createOscillator();
  lfo.type = 'sine'; lfo.frequency.value = 30;
  const lfoAmt = AC.createGain(); lfoAmt.gain.value = 0.34;
  lfo.connect(lfoAmt); lfoAmt.connect(am.gain);
  shaper.connect(am);

  const nBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const nd = nBuf.getChannelData(0);
  for(let i = 0; i < nd.length; i++) nd[i] = Math.random()*2 - 1;
  const noise = AC.createBufferSource();
  noise.buffer = nBuf; noise.loop = true;
  const nFil = AC.createBiquadFilter();
  nFil.type = 'bandpass'; nFil.frequency.value = 2500; nFil.Q.value = 0.7;
  const nGain = AC.createGain(); nGain.gain.value = 0;
  noise.connect(nFil); nFil.connect(nGain);

  const bus = AC.createGain(); bus.gain.value = 0.9;
  am.connect(bus); nGain.connect(bus);
  const wah = AC.createBiquadFilter();
  wah.type = 'bandpass'; wah.frequency.value = 900; wah.Q.value = 2.2;
  bus.connect(wah);

  const sum = AC.createGain(); sum.gain.value = 1;
  const formant = (freq, q, g) => {
    const f = AC.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const fg = AC.createGain(); fg.gain.value = g;
    wah.connect(f); f.connect(fg); fg.connect(sum);
  };
  formant(1050, 9, 0.9);
  formant(2150, 11, 0.6);
  formant(3350, 13, 0.4);
  const bleed = AC.createGain(); bleed.gain.value = 0.07;
  wah.connect(bleed); bleed.connect(sum);

  const hp = AC.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 360;
  sum.connect(hp); hp.connect(au.master);

  osc.start(t); lfo.start(t); noise.start(t);
  Object.assign(au, { osc, lfo, nGain, wah });
  au.mode = 'synth';
}

function updateAudio(){
  if(!AC || AC.state !== 'running' || !au || !au.mode) return;
  const t = AC.currentTime;
  // 总响度
  au.master.gain.setTargetAtTime(0.85*Math.pow(active, 1.3), t, 0.07);

  if(au.mode === 'sample'){
    // 甩得越快回放越快越高；再叠每圈相位的音高微摆(张力/多普勒感)
    const rate = clamp(Math.pow(rps/RECORDED_RPS, 0.7), 0.6, 1.5);
    au.sample.playbackRate.setTargetAtTime(active > 0.02 ? rate : 0.9, t, 0.09);
    au.sample.detune.setTargetAtTime(50*Math.sin(theta + 0.9)*clamp(active*1.6, 0, 1), t, 0.04);
    return;
  }

  // —— 合成兜底的参数 —— //
  const f0 = clamp(55 + rps*17, 50, 195);
  au.osc.frequency.setTargetAtTime(f0, t, 0.06);
  au.osc.detune.setTargetAtTime(46*Math.sin(theta + 0.9)*clamp(active*1.6, 0, 1), t, 0.03);
  au.lfo.frequency.setTargetAtTime(24 + rps*4.5, t, 0.1);
  const wf = 760 + 520*active + (430 + 330*active)*Math.sin(theta - 0.7);
  au.wah.frequency.setTargetAtTime(Math.max(320, wf), t, 0.025);
  au.nGain.gain.setTargetAtTime((0.03 + 0.17*active)*clamp(drive*4, 0, 1), t, 0.08);
}

/* ============================================================
   物理
   ============================================================ */
function physStep(h){
  const dx = tube.x - stick.x, dy = tube.y - stick.y;
  const d = Math.hypot(dx, dy) || 1e-6;
  const ux = dx/d, uy = dy/d;
  let ax = 0, ay = GRAV;
  if(d > ROPE_LEN){                       // 绳只拉不推
    const vrad = tube.vx*ux + tube.vy*uy;
    const f = -ROPE_K*(d - ROPE_LEN) - ROPE_D*vrad;
    ax += f*ux; ay += f*uy;
  }
  ax -= AIR_DRAG*tube.vx;
  ay -= AIR_DRAG*tube.vy;
  tube.vx += ax*h; tube.vy += ay*h;
  tube.x += tube.vx*h; tube.y += tube.vy*h;
}

function update(dt){
  // 甩杆目标：手动指针 / 自动画圈 / 甩手机体感
  if(auto.on){
    auto.rps += (3.4 - auto.rps)*Math.min(1, dt*1.1);
    auto.phase += auto.rps*TAU*dt;
    target.x = auto.cx + AUTO_R*Math.cos(auto.phase);
    target.y = auto.cy + AUTO_R*Math.sin(auto.phase);
  }else{
    auto.rps *= Math.max(0, 1 - dt*3);
    if(motion.on && !pointer.down){
      // 开了体感却收不到传感器事件(权限/环境问题)，2.5s 后自动退出并提示
      if(!motion.gotEvent && performance.now() - motion.enabledAt > 2500){
        setMotion(false);
        flashBtn(motionBtn, '不可用');
      }else{
        const cx = W*0.5, cy = H*0.42;
        const R = Math.min(W, H)*0.22;
        target.x = clamp(cx + motion.ax*16, cx - R, cx + R);
        target.y = clamp(cy - motion.ay*16, cy - R, cy + R);
      }
    }
  }
  const k = 1 - Math.exp(-dt*26);
  stick.x += (target.x - stick.x)*k;
  stick.y += (target.y - stick.y)*k;

  // 定步长积分
  let acc = dt;
  const h = 1/240;
  while(acc > 1e-6){ const s = Math.min(h, acc); physStep(s); acc -= s; }

  // 角速度(发声核心)：绳方向的转动快慢
  theta = Math.atan2(tube.y - stick.y, tube.x - stick.x);
  let dth = theta - prevTheta;
  while(dth >  Math.PI) dth -= TAU;
  while(dth < -Math.PI) dth += TAU;
  omega += (dth/dt - omega)*Math.min(1, dt*9);
  prevTheta = theta;
  rps = Math.abs(omega)/TAU;

  // 手动甩出的圈数计入「哇」——自动甩不算数
  if(!auto.on && active > 0.3){
    revAccum += Math.abs(dth);
    if(revAccum >= TAU){
      const n = Math.floor(revAccum/TAU);
      revAccum -= n*TAU;
      addWah(n);
    }
  }else{
    revAccum = 0;
  }

  ropeDist = Math.hypot(tube.x - stick.x, tube.y - stick.y);
  taut = clamp((ropeDist/ROPE_LEN - 0.88)/0.12, 0, 1);
  drive = clamp((rps - 1.1)/2.6, 0, 1);
  const tgt = Math.pow(drive, 1.25)*taut;
  active += (tgt - active)*Math.min(1, dt*(tgt > active ? 10 : 3.2));

  // 完全静置 8s 后挂起音频线程省电；任何交互的 ensureAudio 都会恢复
  if(active < 0.02 && rps < 0.15 && !pointer.down && !auto.on && !motion.on){
    idleTime += dt;
    if(idleTime > 8 && AC && AC.state === 'running') AC.suspend().catch(() => {});
  }else{
    idleTime = 0;
  }

  updateAudio();

  // 音频心跳采样：currentTime 停走 1.5s 即判僵尸，就地重建
  // (重建发生在无手势的帧循环里时，新上下文可能挂起，由解锁药丸引导恢复)
  if(AC && AC.state === 'running'){
    const ct = AC.currentTime;
    if(ct !== acTimeLast){
      acTimeLast = ct;
      acAdvanceWall = performance.now();
    }else if(audioStalled()){
      ensureAudio();
    }
  }else if(AC){
    // 非 running(静置挂起/来电中断等)期间宽限期持续顺延，
    // 恢复 running 的瞬间才不会把健康上下文误判成僵尸杀掉
    acAdvanceWall = performance.now();
  }

  // "想出声却出不了"：正在甩/自动/体感模式下上下文却没在跑 → 重新亮出解锁引导
  const wantSound = auto.on || motion.on || pointer.down || active > 0.05;
  if(wantSound && AC && AC.state !== 'running') needSoundTime += dt;
  else needSoundTime = 0;

  stEls.mineWrap.classList.toggle('hot', active > 0.3);
  if(active > 0.3){
    singTime += dt;
    if(!hintGone && singTime > 1.0){
      hintGone = true;
      document.getElementById('hint').classList.add('gone');
    }
  }
  spawnFx(dt);
}

/* ============================================================
   视觉特效粒子
   ============================================================ */
const ripples = [];   // 声波涟漪
const cries = [];     // 飘出的「哇」
const trail = [];     // 竹筒运动轨迹
let rippleTimer = 0, cryTimer = 0;

function spawnFx(dt){
  trail.unshift({ x: tube.x, y: tube.y });
  if(trail.length > 16) trail.pop();

  rippleTimer -= dt; cryTimer -= dt;
  if(active > 0.15 && rippleTimer <= 0){
    rippleTimer = 0.09;
    ripples.push({ x: tube.x, y: tube.y, r: 16, age: 0, life: 0.7, str: active });
  }
  if(active > 0.3 && cryTimer <= 0 && cries.length < 36){
    cryTimer = 0.22;
    const ux = (tube.x - stick.x)/(ropeDist || 1);
    const uy = (tube.y - stick.y)/(ropeDist || 1);
    const sgn = omega >= 0 ? 1 : -1;
    // 切向飞出
    const tx = -uy*sgn, ty = ux*sgn;
    const sp = 90 + Math.random()*60;
    cries.push({
      x: tube.x + ux*14, y: tube.y + uy*14,
      vx: tx*sp + ux*30, vy: ty*sp + uy*30 - 20,
      age: 0, life: 1.1,
      size: 20 + 30*active,
      rot: (Math.random() - 0.5)*0.8
    });
  }
  for(let i = ripples.length - 1; i >= 0; i--){
    const p = ripples[i];
    p.age += dt; p.r += (200 + 160*p.str)*dt;
    if(p.age >= p.life) ripples.splice(i, 1);
  }
  for(let i = cries.length - 1; i >= 0; i--){
    const p = cries[i];
    p.age += dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= (1 - dt*1.2); p.vy = p.vy*(1 - dt*1.2) - 26*dt;
    if(p.age >= p.life) cries.splice(i, 1);
  }
}

/* ============================================================
   绘制
   ============================================================ */
function draw(now, dt){
  // 背景（天空+暖光，离屏层）
  if(bgLayer && bgLayer.width > 0) ctx.drawImage(bgLayer, 0, 0, W, H);

  // 星
  const starColor = themeColors.starColor || '#e8ecff';
  for(const s of stars){
    const tw = s.a*(0.6 + 0.4*Math.sin(now*s.sp + s.ph));
    ctx.globalAlpha = tw;
    ctx.fillStyle = starColor;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 月 + 竹影（离屏层）
  if(moonBambooLayer && moonBambooLayer.width > 0) ctx.drawImage(moonBambooLayer, 0, 0, W, H);

  // 季节粒子（按真实 dt 漂移，高刷屏不加速）
  const particleTheme = document.documentElement.getAttribute('data-theme') || 'autumn';
  for(const f of flies){
    if(f.type === 'firefly'){
      f.x += f.vx*dt; f.y += f.vy*dt;
      if(f.x < -10) f.x = W + 10; if(f.x > W + 10) f.x = -10;
      if(f.y < H*0.3) f.vy = Math.abs(f.vy);
      if(f.y > H + 10) f.y = H*0.5;
      f.vx += Math.sin(now*0.7 + f.ph)*(18*dt);
      f.vy += Math.cos(now*0.9 + f.ph)*(12*dt);
      const glow = Math.max(0, Math.sin(now*f.sp + f.ph));
      if(glow < 0.05) continue;
      ctx.globalAlpha = glow*0.85;
      ctx.fillStyle = themeColors.fireflyColor || '#ffd98a';
      ctx.shadowColor = themeColors.fireflyGlow || '#ffc35e'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(f.x, f.y, 1.8, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      f.x += f.vx*dt + Math.sin(now*f.sp + f.ph)*(8*dt);
      f.y += f.vy*dt;
      if(f.y > H + 10){ f.y = -10; f.x = Math.random()*W; }
      if(f.x < -20) f.x = W + 20; if(f.x > W + 20) f.x = -20;
      if(f.type === 'petal'){
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = themeColors.fireflyColor || '#c8ffd0';
        ctx.beginPath(); ctx.ellipse(f.x, f.y, 3, 2, now*0.5 + f.ph, 0, TAU); ctx.fill();
      } else if(f.type === 'leaf'){
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = themeColors.fireflyColor || '#ffd98a';
        ctx.beginPath(); ctx.ellipse(f.x, f.y, 3.5, 2, now*0.3 + f.ph, 0, TAU); ctx.fill();
      } else if(f.type === 'snow'){
        ctx.globalAlpha = 0.5 + Math.sin(now*f.sp + f.ph)*0.2;
        ctx.fillStyle = themeColors.fireflyColor || '#c8e0ff';
        ctx.beginPath(); ctx.arc(f.x, f.y, 1.5 + Math.sin(f.ph)*0.8, 0, TAU); ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;

  // 声波涟漪
  const rippleColor = themeColors.rippleColor || '#ffcf9e';
  for(const p of ripples){
    const t = p.age/p.life;
    ctx.globalAlpha = (1 - t)*0.35*p.str;
    ctx.strokeStyle = rippleColor; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 运动残影：渐隐光点（高速下连线会成折线，点更好看）
  const spNorm = clamp(rps/4, 0, 1);
  if(spNorm > 0.05 && trail.length > 2){
    ctx.fillStyle = themeColors.trailColor || '#ffb36b';
    for(let i = 1; i < trail.length; i++){
      const f = 1 - i/trail.length;
      ctx.globalAlpha = f*0.3*spNorm;
      ctx.beginPath();
      ctx.arc(trail[i].x, trail[i].y, 1.5 + 3.5*f, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  if(use3d){
    toy3d.render({ now, dt, stick, tube, ropeLen: ROPE_LEN, ropeDist,
                   omega, active, stickTilt: STICK_TILT3D });
  }else{
    drawToy(now);
  }

  // 飘出的「哇」
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const p of cries){
    const t = p.age/p.life;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot*t);
    ctx.globalAlpha = (1 - t)*(1 - t)*0.95;
    ctx.font = `${(p.size*(1 + 0.5*t)).toFixed(1)}px ${FONT}`;
    ctx.shadowColor = 'rgba(255,150,60,0.9)';
    ctx.shadowBlur = 18*(1 - t);
    ctx.fillStyle = '#ffb066';
    ctx.fillText('哇', 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 暗角 + 颗粒（离屏层）
  if(fgLayer && fgLayer.width > 0) ctx.drawImage(fgLayer, 0, 0, W, H);
}

function drawToy(now){
  const dx = tube.x - stick.x, dy = tube.y - stick.y;
  const d = Math.hypot(dx, dy) || 1e-6;
  const ux = dx/d, uy = dy/d;

  // 红线：松则垂，紧则直
  ctx.strokeStyle = themeColors.ropeColor || 'rgba(216,74,53,0.92)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(stick.x, stick.y);
  if(d < ROPE_LEN*0.97){
    const sag = (ROPE_LEN - d)*0.55;
    ctx.quadraticCurveTo((stick.x + tube.x)/2, (stick.y + tube.y)/2 + sag, tube.x, tube.y);
  }else{
    ctx.lineTo(tube.x, tube.y);
  }
  ctx.stroke();

  // 甩杆：细竹签，杆梢串两颗红珠（照实物）；局部坐标绘制以复用渐变
  const sa = 1.15;                 // 杆的固定倾角
  const sdx = Math.cos(sa), sdy = Math.sin(sa);
  ctx.save();
  ctx.translate(stick.x, stick.y);
  if(!stickGrad){
    stickGrad = ctx.createLinearGradient(0, 0, sdx*88, sdy*88);
    stickGrad.addColorStop(0, '#e2cd9a'); stickGrad.addColorStop(1, '#a8894f');
  }
  ctx.strokeStyle = stickGrad;
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(sdx*8, sdy*8);
  ctx.lineTo(sdx*88, sdy*88);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,240,200,0.35)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(sdx*12 - sdy*1.4, sdy*12 + sdx*1.4);
  ctx.lineTo(sdx*76 - sdy*1.4, sdy*76 + sdx*1.4);
  ctx.stroke();
  // 红珠
  const bead = (bx, by, r) => {
    ctx.fillStyle = '#c23324';
    ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,200,180,0.55)';
    ctx.beginPath(); ctx.arc(bx - r*0.3, by - r*0.35, r*0.32, 0, TAU); ctx.fill();
  };
  bead(sdx*14, sdy*14, 4.6);
  bead(sdx*4,  sdy*4,  6);
  ctx.restore();

  // 蝉形竹筒：膜端(头)朝绳，筒身沿绳方向甩出
  ctx.save();
  ctx.translate(tube.x, tube.y);
  ctx.rotate(Math.atan2(uy, ux) - Math.PI/2);
  ctx.scale(1.35, 1.35);

  // 筒身：浅竹色
  if(!tubeGrad){
    tubeGrad = ctx.createLinearGradient(-12, 0, 12, 0);
    tubeGrad.addColorStop(0, '#b7a271');
    tubeGrad.addColorStop(0.3, '#eadfb8');
    tubeGrad.addColorStop(0.62, '#dfd0a2');
    tubeGrad.addColorStop(1, '#9b8452');
  }
  ctx.fillStyle = tubeGrad;
  ctx.beginPath();
  ctx.roundRect(-12, 4, 24, 46, 6);
  ctx.fill();

  // 尾端开口
  ctx.fillStyle = '#4c3d24';
  ctx.beginPath(); ctx.ellipse(0, 49, 11, 4.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(234,223,184,0.6)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(0, 49, 11, 4.2, 0, 0.05, Math.PI - 0.05); ctx.stroke();

  // 一对竹蝉翼：转得越快离心张得越开，同时高频振翅
  const spread  = 0.30 + active*0.38;
  const flutter = active*Math.sin(now*46)*0.22;
  const wing = side => {
    ctx.save();
    ctx.translate(side*9, 13);
    ctx.rotate(side*(spread + flutter));
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(side*13, 9, side*14, 30, side*5, 42);
    ctx.bezierCurveTo(side*-1, 33, side*-4, 12, 0, 0);
    ctx.fillStyle = 'rgba(243,235,211,0.88)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,120,70,0.55)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 翼脉
    ctx.strokeStyle = 'rgba(150,120,70,0.45)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(side*2, 4);  ctx.quadraticCurveTo(side*9, 18, side*5, 38);
    ctx.moveTo(side*1, 6);  ctx.quadraticCurveTo(side*3, 20, side*1.5, 34);
    ctx.stroke();
    ctx.restore();
  };
  wing(-1); wing(1);

  // 红箍(蝉头)
  ctx.fillStyle = '#cf3b2a';
  ctx.beginPath();
  ctx.roundRect(-12.5, 2, 25, 10, 4);
  ctx.fill();

  // 膜面(蒙在红箍里的竹膜) + 发声时透光
  ctx.fillStyle = '#f6eed8';
  ctx.beginPath(); ctx.ellipse(0, 3, 10.5, 4.2, 0, 0, TAU); ctx.fill();
  if(active > 0.05){
    ctx.globalAlpha = active*0.85;
    ctx.shadowColor = '#ffcf8e'; ctx.shadowBlur = 18*active;
    ctx.fillStyle = '#ffe9bd';
    ctx.beginPath(); ctx.ellipse(0, 3, 8.5, 3.4, 0, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  // 一对黑眼睛，点在红箍两侧
  const eye = side => {
    ctx.fillStyle = '#17130c';
    ctx.beginPath(); ctx.arc(side*8.5, 7.5, 2.4, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(side*8.5 - 0.7, 6.8, 0.7, 0, TAU); ctx.fill();
  };
  eye(-1); eye(1);

  // 膜心线结
  ctx.fillStyle = '#d84a35';
  ctx.beginPath(); ctx.arc(0, 2, 2, 0, TAU); ctx.fill();

  ctx.restore();
}

/* —— 甩手机体感模式：握住手机划圈，重力方向在机身坐标里转动 —— */
const motion = { on: false, ax: 0, ay: 0, bx: 0, by: 0,
                 handler: null, gotEvent: false, enabledAt: 0 };
const motionBtn = document.getElementById('motionBtn');
// 鸿蒙环境通过 __harmonyAccel 注入加速度，无需安全上下文或 devicemotion
const isHarmony = typeof window.__harmonyAccel !== 'undefined' ||
                  /HarmonyOS|OpenHarmony/.test(navigator.userAgent);
// devicemotion 只在安全上下文(HTTPS/file)派发，http 下不显示按钮免得点了没反应

  motionBtn.style.display = '';
}

function flashBtn(btn, text){
  btn.textContent = text;
  btn.disabled = true;
  setTimeout(() => { btn.textContent = '甩手机'; btn.disabled = false; }, 1600);
}

async function setMotion(on){
  if(on && !isHarmony && typeof DeviceMotionEvent !== 'undefined'
        && typeof DeviceMotionEvent.requestPermission === 'function'){
    try{
      const r = await DeviceMotionEvent.requestPermission();  // iOS 需授权
      if(r !== 'granted'){ flashBtn(motionBtn, '未授权'); return; }
    }catch(_){ flashBtn(motionBtn, '未授权'); return; }
  }
  motion.on = on;
  motionBtn.classList.toggle('on', on);
  motionBtn.textContent = on ? '停一停' : '甩手机';
  if(on){
    interacted = true;
    if(auto.on) setAuto(false);
    ensureAudio(true);
    motion.ax = motion.ay = motion.bx = motion.by = 0;
    motion.gotEvent = false;
    motion.enabledAt = performance.now();
    if(isHarmony){
      // 鸿蒙：轮询注入的加速度数据（与 Native 侧 25ms 间隔对齐）
      if(!motion.harmonyHandler){
        motion.harmonyHandler = () => {
          const data = window.__harmonyAccel;
          if(!data || data.x == null) return;
          motion.gotEvent = true;
          const gx = data.x, gy = data.y;
          // 慢基线滤掉静止重力，留下随挥舞转动的分量
          motion.bx += (gx - motion.bx)*0.02;
          motion.by += (gy - motion.by)*0.02;
          motion.ax += ((gx - motion.bx) - motion.ax)*0.35;
          motion.ay += ((gy - motion.by) - motion.ay)*0.35;
        };
      }
      if(motion._harmonyInterval) clearInterval(motion._harmonyInterval);
      motion._harmonyInterval = setInterval(motion.harmonyHandler, 25);
    } else {
      if(!motion.handler){
        motion.handler = e => {
          const g = e.accelerationIncludingGravity;
          if(!g || g.x == null) return;
          motion.gotEvent = true;
          // 慢基线滤掉静止重力，留下随挥舞转动的分量
          motion.bx += (g.x - motion.bx)*0.02;
          motion.by += (g.y - motion.by)*0.02;
          motion.ax += ((g.x - motion.bx) - motion.ax)*0.35;
          motion.ay += ((g.y - motion.by) - motion.ay)*0.35;
        };
      }
      window.addEventListener('devicemotion', motion.handler);
    }
  }else{
    if(isHarmony && motion._harmonyInterval){
      clearInterval(motion._harmonyInterval);
      motion._harmonyInterval = null;
    } else if(motion.handler){
      window.removeEventListener('devicemotion', motion.handler);
    }
  }
}

  setMotion(!motion.on);
});

async function createIdentity(){

    if(!data || !data.id || !data.code || !data.token){

async function ensureIdentity(){
  if(identity) return identity;
  if(loadIdentity()) return identity;
  if(identityPromise) return identityPromise;
  identityPromise = createIdentity();
  try{ return await identityPromise; }

}

/* —— WebSocket 全球计数（新协议：player/migrate/score/stats/earth） —— */
const WSS_URL = 'wss://zhuzhiliao.aimfor.top/api/ws';
let ws = null, wsRetry = 0, lastWahs = -1;
let wsConnecting = false;
let serverScore = 0;            // 服务端记录的个人分数
let isMigrated = false;         // 是否已完成迁移
let personalWahs = 0;           // 本地累计哇数（与 myWah 同步）
let scoreInFlight = false;      // 防止并发 score 请求
let earthRevision = 0;          // 当前地球修订号
const earthRequests = new Map();// requestID → callback
let meJoined = false;           // 是否已加入哇声地球

// 鸿蒙原生 WebSocket 桥接回调绑定（仅绑一次）
let nativeBridgeBound = false;
function setupNativeBridge(){
  if(nativeBridgeBound) return;
  nativeBridgeBound = true;
  window.__bridge = window.__bridge || {};
  window.__bridge.onWsOpen    = () => onWsOpen();
  window.__bridge.onWsMessage = data => onWsMessage(data);
  window.__bridge.onWsClose   = () => onWsClose();
  // HTTP 桥接回调：原生层发起请求后通过 onHttpResult 回传结果
  window.__bridge.onHttpResult = raw => {
    try{
      const r = JSON.parse(raw);
      const cb = httpCallbacks.get(r.seq);
      if(cb){
        httpCallbacks.delete(r.seq);
        cb(r.status, r.body);
      }
    }catch(_){}
  };
}

/* —— 原生 HTTP 桥接：绕过 ArkWeb origin=null 导致的 CORS 拦截 —— */
let httpSeq = 0;
const httpCallbacks = new Map();
function nativeFetch(method, url, headers, body){
  // 浏览器环境降级：无原生桥接时走标准 fetch
  if(!window.__nativeBridge || typeof window.__nativeBridge.httpFetch !== 'function'){
    console.warn('[HTTP] no nativeBridge, fallback to fetch:', method, url);
    const opts = { method, headers: headers || {} };
    if(body && (method === 'POST' || method === 'PUT')) opts.body = body;
    return fetch(url, opts);
  }
  // 鸿蒙环境：确保 onHttpResult 回调已绑定
  setupNativeBridge();
  return new Promise((resolve, reject) => {
    const seq = ++httpSeq;
    console.info('[HTTP] bridge seq=', seq, method, url, 'hasToken=', !!(headers && headers['Authorization']));
    const to = setTimeout(() => {
      if(httpCallbacks.has(seq)){
        httpCallbacks.delete(seq);
        console.error('[HTTP] timeout seq=', seq, url);
        reject(new Error('timeout'));
      }
    }, 20000);
    httpCallbacks.set(seq, (status, respBody) => {
      clearTimeout(to);
      console.info('[HTTP] resp seq=', seq, 'status=', status, 'len=', (respBody || '').length);
      resolve({
        ok: status >= 200 && status < 300,
        status: status,
        text: () => Promise.resolve(respBody),
        json: () => { try{ return Promise.resolve(JSON.parse(respBody)); }catch(e){ console.error('[HTTP] json parse fail seq=', seq, e); return Promise.reject(e); } }
      });
    });
    try{
      // 从 headers 中提取 token（原生层只接收 token 字符串，避免 JSON.parse 的 any 类型问题）
      const authHeader = (headers && headers['Authorization']) || '';
      const token = authHeader.startsWith('Bearer ') ? authHeader.slice(7) : authHeader;
      window.__nativeBridge.httpFetch(seq, method, url, token, body || '');
    }catch(e){
      httpCallbacks.delete(seq);
      clearTimeout(to);
      console.error('[HTTP] bridge call failed seq=', seq, e);
      reject(e);
    }
  });
}
function wsConnect(){
  if(wsConnecting) return;
  if(ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  wsConnecting = true;
  ensureIdentity().then(id => {
    if(!id){ wsConnecting = false; scheduleReconnect(); return; }
    if(window.__nativeBridge && typeof window.__nativeBridge.wsConnect === 'function'){
      // 鸿蒙环境：原生桥接（支持 Authorization 头）
      setupNativeBridge();
      try{ window.__nativeBridge.wsConnect(id.token); }
      catch(_){ wsConnecting = false; scheduleReconnect(); }
    }else{
      // 浏览器：无法设置 Authorization 头，降级为未认证连接
      try{
        ws = new WebSocket(WSS_URL);
        ws.onopen    = () => { wsConnecting = false; onWsOpen(); };
        ws.onmessage = ev => onWsMessage(ev.data);
        ws.onclose   = () => { wsConnecting = false; ws = null; onWsClose(); };
        ws.onerror   = () => { try{ ws.close(); }catch(_){} };
      }catch(_){ wsConnecting = false; scheduleReconnect(); }
    }
  });
}
function onWsOpen(){ wsRetry = 0; console.info('[WS] opened'); }
function onWsMessage(data){
  let m;
  try{ m = typeof data === 'string' ? JSON.parse(data) : data; }catch(_){ console.warn('[WS] message parse failed:', typeof data, data ? (typeof data === 'string' ? data.slice(0,200) : '') : ''); return; }
  if(!m || typeof m !== 'object') return;
  console.info('[WS] msg t=' + m.t + (m.requestID ? ' req=' + m.requestID.slice(0,8) : ''));
  switch(m.t){
    case 'player':
      // 连接建立后服务端先发 player 消息（认证玩家）
      serverScore = m.score || 0;
      isMigrated = !!m.migrated;
      meJoined = !!m.earthEnabled;
      if(!isMigrated){
        // 未迁移 → 发 migrate 消息上报本地累计哇数
        wsSend({ t: 'migrate', personal: myWah, pendingGlobal: 0 });
      }
      flushScore();
      break;
    case 'migration':
      // 服务端确认迁移结果
      serverScore = m.score || 0;
      isMigrated = !!m.migrated;
      flushScore();
      break;
    case 'score':
      // 服务端确认 score 上报
      scoreInFlight = false;
      serverScore = m.score != null ? m.score : serverScore;
      break;
    case 'stats':
      // 全球统计广播
      stEls.online.textContent = fmt(m.online);
      stEls.wahs.textContent = fmt(m.wahs);
      if(lastWahs >= 0 && m.wahs > lastWahs){
        const el = stEls.wahs;
        el.classList.remove('wahflash');
        void el.offsetWidth;
        el.classList.add('wahflash');
      }
      lastWahs = m.wahs;
      break;
    case 'pong':
      break;
    case 'earth_snapshot': {
      // 地球快照响应
      console.info('[Earth] snapshot received req=' + (m.requestID || '').slice(0,8) + ' nodes=' + (m.nodes ? m.nodes.length : 0));
      const cb = earthRequests.get(m.requestID);
      if(cb){ earthRequests.delete(m.requestID); cb(m); }
      else console.warn('[Earth] snapshot no matching request, pending=' + earthRequests.size);
      break;
    }
    case 'earth_revision':
      // 地球修订号变更 → 120ms 防抖后触发重新请求（与 iOS 一致）
      if(m.revision && m.revision !== earthRevision){
        earthRevision = m.revision;
        if(earthView && earthView.isOpen) earthView.requestSnapshotDebounced();
      }
      break;
  }
}

/* ============================================================
   功能五：位置格网计算
   ============================================================ */
const EARTH_CELL_SIZE_KM = 20;
const EARTH_LATITUDE_STEP = EARTH_CELL_SIZE_KM / 111.32;
function cellID(latitude, longitude){
  if(latitude < -90 || latitude > 90 || longitude < -180 || longitude > 180) return null;
  const latBandCount = Math.ceil(180 / EARTH_LATITUDE_STEP);
  const latIndex = Math.min(Math.max(Math.floor((latitude + 90) / EARTH_LATITUDE_STEP), 0), latBandCount - 1);
  const centerLat = Math.min(90 - EARTH_LATITUDE_STEP / 2, -90 + (latIndex + 0.5) * EARTH_LATITUDE_STEP);
  const circumference = 40075 * Math.max(Math.cos(centerLat * Math.PI / 180), 0);
  const lonBandCount = Math.max(1, Math.round(circumference / EARTH_CELL_SIZE_KM));
  const normLon = longitude === 180 ? -180 : longitude;
  const lonIndex = Math.min(Math.max(Math.floor((normLon + 180) / 360 * lonBandCount), 0), lonBandCount - 1);
  return `v1:${latIndex}:${lonIndex}`;
}

// UUID 生成（crypto.randomUUID 不可用时回退）
function uuid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

// 请求设备定位（鸿蒙原生桥接 / 浏览器 Geolocation）
function requestLocation(){
  if(window.__nativeBridge && typeof window.__nativeBridge.requestLocation === 'function'){
    window.__bridge = window.__bridge || {};
    return new Promise((resolve, reject) => {
      const to = setTimeout(() => {
        window.__bridge.onLocation = null;
        window.__bridge.onLocationError = null;
        reject(new Error('timeout'));
      }, 10000);
      window.__bridge.onLocation = pos => {
        clearTimeout(to);
        window.__bridge.onLocation = null;
        window.__bridge.onLocationError = null;
        resolve(pos);
      };
      window.__bridge.onLocationError = () => {
        clearTimeout(to);
        window.__bridge.onLocation = null;
        window.__bridge.onLocationError = null;
        reject(new Error('denied'));
      };
      try{ window.__nativeBridge.requestLocation(); }
      catch(e){
        clearTimeout(to);
        window.__bridge.onLocation = null;
        window.__bridge.onLocationError = null;
        reject(e);
      }
    });
  }
  if(navigator.geolocation){
    return new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
        err => reject(err),
        { timeout: 10000, enableHighAccuracy: false }
      );
    });
  }
  return Promise.reject(new Error('no geolocation'));
}

const earthOverlay = document.getElementById('earthOverlay');

// 缩放距离 → detail 级别 0-4
function earthDetailForDistance(d){
  if(d >= 3.75) return 0;
  if(d >= 3.35) return 1;
  if(d >= 2.70) return 2;
  if(d >= 2.10) return 3;
  return 4;
}

// 地理坐标 → 球面三维坐标
function latLonToVec3(lat, lon, radius){
  const phi = lat * Math.PI / 180;
  const theta = lon * Math.PI / 180;
  const r = Math.cos(phi);
  return new THREE_MOD.Vector3(
    -r * Math.cos(theta) * radius,
    Math.sin(phi) * radius,
    r * Math.sin(theta) * radius
  );
}

async function ensureEarthView(){
  if(earthView) return earthView;
  console.info('[Earth] ensureEarthView start, hasBridge=', !!window.__nativeBridge, 'THREE_EARTH=', !!window.THREE_EARTH);
  // 优先使用原生层注入的 UMD 版本（鸿蒙 ArkWeb）
  if(window.THREE_EARTH){
    THREE_MOD = window.THREE_EARTH;
    console.info('[Earth] THREE_EARTH already present');
  }else if(window.__nativeBridge){
    // 鸿蒙环境：等待原生层注入 THREE_EARTH（最多等 5 秒）
    console.info('[Earth] waiting for THREE_EARTH injection (max 5s)...');
    const waited = await waitForThreeEarth(5000);
    if(!waited){
      console.error('[Earth] THREE_EARTH injection timeout — injectThreeJS in Index.ets may have failed (check hilog for "Three.js injected" or readRawFile errors)');
      return null;
    }
    THREE_MOD = window.THREE_EARTH;
    console.info('[Earth] THREE_EARTH injected ok');
  }else{
    // 浏览器环境降级：ES 模块动态 import
    try{
      THREE_MOD = await import('three');
      console.info('[Earth] using ES module three');
    }catch(e){ console.error('[Earth] import three failed:', e); return null; }
  }
  try{
    earthView = createEarthView();
    console.info('[Earth] createEarthView ok');
  }catch(e){ console.error('[Earth] createEarthView failed:', e.message || e, e && e.stack); return null; }
  return earthView;
}

// 等待原生层注入 window.THREE_EARTH
function waitForThreeEarth(timeout){
  return new Promise(resolve => {
    if(window.THREE_EARTH) return resolve(true);
    const start = Date.now();
    const timer = setInterval(() => {
      if(window.THREE_EARTH){ clearInterval(timer); resolve(true); }
      else if(Date.now() - start > timeout){ clearInterval(timer); resolve(false); }
    }, 100);
  });
}

function createEarthView(){
  const THREE = THREE_MOD;
  const EARTH_RADIUS = 2;
  const renderer = new THREE.WebGLRenderer({ canvas: earthCanvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(41, 1, 0.1, 100);
  let cameraDistance = 3.75;
  let rot = { x: 0.3, y: 0 };
  let autoRotate = true;
  let lastInteraction = performance.now();
  let nodes = [];
  let dotMeshes = [];
  let rippleMeshes = [];
  let selectedNode = null;
  let lastDetail = -1;
  let loadFailed = false;
  let snapshotTimer = null;
  let revisionTimer = null;   // earth_revision 120ms 防抖
  let detailTimer = null;     // detail 变化 180ms 防抖
  let isOpen = false;
  let rafId = null;
  let lastFrameTime = 0;       // 帧时间戳，用于帧率不敏感的自动旋转
  let requestSerial = 0;       // 请求序列号，防止过期响应覆盖新数据

  // 地球球体：比背景稍亮的深蓝，保证可见
  const earthGeo = new THREE.SphereGeometry(EARTH_RADIUS, 64, 48);
  const earthMat = new THREE.MeshBasicMaterial({ color: 0x0d2b4a });
  const earth = new THREE.Mesh(earthGeo, earthMat);
  scene.add(earth);

  // 经纬线网格：半透明白色细线，让球体有"地图"感
  const gridGeo = new THREE.WireframeGeometry(new THREE.SphereGeometry(EARTH_RADIUS * 1.002, 24, 16));
  const gridMat = new THREE.LineBasicMaterial({ color: 0x4a7ab8, transparent: true, opacity: 0.25 });
  const gridLines = new THREE.LineSegments(gridGeo, gridMat);
  scene.add(gridLines);

  // 大气层光晕：稍大的半透明球体，边缘发光感
  const atmoGeo = new THREE.SphereGeometry(EARTH_RADIUS * 1.04, 64, 48);
  const atmoMat = new THREE.MeshBasicMaterial({ color: 0x2a6db5, transparent: true, opacity: 0.08, side: THREE.BackSide });
  const atmosphere = new THREE.Mesh(atmoGeo, atmoMat);
  scene.add(atmosphere);

  // 国家边界线组（从注入的 GeoJSON 绘制）
  const boundaryGroup = new THREE.Group();
  scene.add(boundaryGroup);
  let boundaryLoaded = false;

  function loadBoundaries(){
    if(boundaryLoaded) return;
    const gj = window.__geoJSON;
    if(!gj || !gj.features) return;
    const positions = [];
    for(const feature of gj.features){
      const geom = feature.geometry;
      if(!geom) continue;
      const coords = geom.type === 'Polygon' ? [geom.coordinates] :
                     geom.type === 'MultiPolygon' ? geom.coordinates : [];
      for(const polygon of coords){
        for(const ring of polygon){
          for(let i = 0; i < ring.length - 1; i++){
            const p0 = ring[i], p1 = ring[i + 1];
            if(p0.length < 2 || p1.length < 2) continue;
            // GeoJSON 格式：[经度, 纬度]
            const v0 = latLonToVec3(p0[1], p0[0], EARTH_RADIUS * 1.003);
            const v1 = latLonToVec3(p1[1], p1[0], EARTH_RADIUS * 1.003);
            positions.push(v0.x, v0.y, v0.z, v1.x, v1.y, v1.z);
          }
        }
      }
    }
    if(positions.length === 0) return;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const mat = new THREE.LineBasicMaterial({ color: 0x6a9ac8, transparent: true, opacity: 0.35 });
    const lines = new THREE.LineSegments(geo, mat);
    boundaryGroup.add(lines);
    boundaryLoaded = true;
    console.info('[Earth] boundaries loaded, segments:', positions.length / 6);
  }

  // 页面加载时 GeoJSON 已注入，立即尝试加载边界线
  loadBoundaries();

  // 节点圆点组
  const dotsGroup = new THREE.Group();
  scene.add(dotsGroup);

  // 共鸣波纹组（3 个 torus 环，2.8 秒周期，相位 0/0.33/0.66）
  const ripplesGroup = new THREE.Group();
  scene.add(ripplesGroup);
  for(let i = 0; i < 3; i++){
    const torusGeo = new THREE.TorusGeometry(0.08, 0.008, 8, 48);
    const torusMat = new THREE.MeshBasicMaterial({ color: 0xFAB84A, transparent: true, opacity: 0 });
    const torus = new THREE.Mesh(torusGeo, torusMat);
    torus.visible = false;
    torus.userData.phase = i / 3;       // 相位 0 / 0.33 / 0.66
    ripplesGroup.add(torus);
    rippleMeshes.push(torus);
  }

  function resize(){
    const w = earthOverlay.clientWidth || window.innerWidth;
    const h = earthOverlay.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  // 请求地球快照
  function requestSnapshot(){
    if(!isOpen) return;
    requestSerial++;
    const serial = requestSerial;
    const requestID = uuid();
    const detail = earthDetailForDistance(cameraDistance);
    console.info('[Earth] requestSnapshot id=' + requestID.slice(0,8) + ' detail=' + detail + ' serial=' + serial);
    earthRequests.set(requestID, data => {
      if(serial !== requestSerial){
        console.info('[Earth] skip stale response id=' + requestID.slice(0,8) + ' serial=' + serial + ' current=' + requestSerial);
        return;
      }
      if(snapshotTimer){ clearTimeout(snapshotTimer); snapshotTimer = null; }
      loadFailed = false;
      if(data.revision != null) earthRevision = data.revision;
      if(data.nodes) renderNodes(data.nodes);
      updateBottomPanel();
    });
    if(snapshotTimer) clearTimeout(snapshotTimer);
    snapshotTimer = setTimeout(() => {
      earthRequests.delete(requestID);
      console.warn('[Earth] snapshot timeout id=' + requestID.slice(0,8) + ' serial=' + serial + ' nodes=' + nodes.length);
      if(!nodes.length){ loadFailed = true; updateBottomPanel(); }
    }, 10000);
    wsSend({ t: 'earth_view', requestID, detail, bounds: [] });
  }

  // 防抖版 requestSnapshot：earth_revision 触发时 500ms 内合并多次
  function requestSnapshotDebounced(){
    if(revisionTimer) clearTimeout(revisionTimer);
    revisionTimer = setTimeout(() => {
      revisionTimer = null;
      requestSnapshot();
    }, 500);
  }

  // 渲染节点圆点
  function renderNodes(newNodes){
    nodes = newNodes || [];
    // 清除旧圆点
    while(dotMeshes.length){
      const m = dotMeshes.pop();
      dotsGroup.remove(m);
      m.geometry.dispose();
      m.material.dispose();
    }
    const meCode = identity && identity.code;
    let meNode = null;
    for(const node of nodes){
      if(node.latitude == null || node.longitude == null) continue;
      const isMe = node.kind === 'player' && (node.isMe || (meCode && node.code === meCode));
      if(isMe) meNode = node;
      const score = node.score || 0;
      // 增大圆点大小，按 log10(score+1) 缩放
      const sizeScale = 0.04 + 0.07 * Math.log10(score + 1);
      const r = Math.max(0.05, sizeScale);
      const geo = new THREE.SphereGeometry(r, 16, 16);
      const color = isMe ? 0xFAB84A : 0x5CDBD6;   // 自己暖橙金 / 他人青绿
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.85 });
      const mesh = new THREE.Mesh(geo, mat);
      // 添加发光外圈（稍大半透明球体）
      const glowGeo = new THREE.SphereGeometry(r * 1.6, 16, 16);
      const glowMat = new THREE.MeshBasicMaterial({
        color, transparent: true, opacity: 0.25, side: THREE.BackSide
      });
      const glowMesh = new THREE.Mesh(glowGeo, glowMat);
      mesh.add(glowMesh);
      const pos = latLonToVec3(node.latitude, node.longitude, EARTH_RADIUS * 1.01);
      mesh.position.copy(pos);
      mesh.userData = node;
      dotsGroup.add(mesh);
      dotMeshes.push(mesh);
    }
    // 共鸣波纹定位到「我」的节点
    if(meNode){
      const pos = latLonToVec3(meNode.latitude, meNode.longitude, EARTH_RADIUS * 1.01);
      for(const torus of rippleMeshes){
        torus.position.copy(pos);
        torus.lookAt(0, 0, 0);
        torus.visible = true;
      }
    }else{
      for(const torus of rippleMeshes) torus.visible = false;
    }
  }

  // 点击拾取
  function pickNode(clientX, clientY){
    const rect = earthCanvas.getBoundingClientRect();
    const x = ((clientX - rect.left) / rect.width) * 2 - 1;
    const y = -((clientY - rect.top) / rect.height) * 2 + 1;
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera({ x, y }, camera);
    const hits = raycaster.intersectObjects(dotMeshes);
    return hits.length ? hits[0].object.userData : null;
  }

  // 手势：pan 旋转 / pinch 缩放 / tap 选中（Pointer Events，兼容 HarmonyOS ArkWeb）
  let panStart = null, pinchStart = null;
  let activePointers = new Map();   // pointerId -> {x, y}

  function onPointerDown(e){
    if(e.button !== 0 && e.button !== -1) return; // 只响应主按钮/触摸
    lastInteraction = performance.now();
    try { earthCanvas.setPointerCapture(e.pointerId); } catch(_){}
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if(activePointers.size === 2){
      const pts = Array.from(activePointers.values());
      const dx = pts[0].x - pts[1].x;
      const dy = pts[0].y - pts[1].y;
      pinchStart = { dist: Math.hypot(dx, dy), z: cameraDistance };
      panStart = null;
    } else if(activePointers.size === 1){
      panStart = { x: e.clientX, y: e.clientY, rx: rot.x, ry: rot.y, moved: false };
    }
  }
  function onPointerMove(e){
    if(!activePointers.has(e.pointerId)) return;
    if(!panStart && !pinchStart) return;
    lastInteraction = performance.now();

    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if(pinchStart && activePointers.size === 2){
      const pts = Array.from(activePointers.values());
      const dx = pts[0].x - pts[1].x;
      const dy = pts[0].y - pts[1].y;
      const d = Math.hypot(dx, dy);
      // 与 iOS 一致：cameraDistance = base / scale
      const scale = d / pinchStart.dist;
      cameraDistance = clamp(pinchStart.z / scale, 1.72, 4.25);
    } else if(panStart && activePointers.size === 1){
      const dx = e.clientX - panStart.x;
      const dy = e.clientY - panStart.y;
      panStart.x = e.clientX; panStart.y = e.clientY;
      if(Math.hypot(dx, dy) > 6) panStart.moved = true;
      // 与 iOS 一致：translation.x * 0.006 / translation.y * 0.005
      rot.y += dx * 0.006;
      rot.x = clamp(rot.x + dy * 0.005, -Math.PI/2, Math.PI/2);
    }
  }
  function onPointerUp(e){
    if(panStart && activePointers.size === 1 && !panStart.moved){
      selectedNode = pickNode(e.clientX, e.clientY);
      updateBottomPanel();
    }
    activePointers.delete(e.pointerId);
    try { earthCanvas.releasePointerCapture(e.pointerId); } catch(_){}
    if(activePointers.size === 0){
      panStart = null;
      pinchStart = null;
    }
  }
  function onPointerCancel(e){
    activePointers.delete(e.pointerId);
    try { earthCanvas.releasePointerCapture(e.pointerId); } catch(_){}
    if(activePointers.size === 0){
      panStart = null;
      pinchStart = null;
    }
  }

  // 底部面板四态
  function updateBottomPanel(){
    earthBottom.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'earth-card';
    if(selectedNode){
      // 态 1：选中节点详情卡
      const n = selectedNode;
      let html = '';
      if(n.kind === 'player'){
        const isMe = identity && n.code === identity.code;
        html = `<div class="earth-card-title">${isMe ? '我' : '玩家·' + (n.code || '未知')}</div>`;
        if(n.score != null) html += `<div class="earth-card-row">哇数 <b>${fmt(n.score)}</b></div>`;
        if(n.activeUntil) html += `<div class="earth-card-row">活跃中</div>`;
      }else{
        html = `<div class="earth-card-title">集群</div>`;
        if(n.userCount != null) html += `<div class="earth-card-row">玩家 <b>${fmt(n.userCount)}</b></div>`;
        if(n.totalWahs != null) html += `<div class="earth-card-row">哇数 <b>${fmt(n.totalWahs)}</b></div>`;
        if(n.activeCount != null) html += `<div class="earth-card-row">活跃 <b>${fmt(n.activeCount)}</b></div>`;
      }
      card.innerHTML = html;
    }else if(loadFailed){
      // 态 4：加载失败
      card.innerHTML = `<div class="earth-card-title">加载失败</div>
        <div class="earth-card-row">无法获取地球数据</div>
        <button class="earth-retry" id="earthRetryBtn">重试</button>`;
    }else if(!meJoined){
      // 态 2：未加入
      card.innerHTML = `<div class="earth-card-title">在地球上点亮我</div>
        <div class="earth-card-row">让你的哇声被全世界看见</div>
        <button class="earth-join-btn" id="earthJoinBtn">加入哇声地球</button>`;
    }else{
      // 态 3：已加入
      card.innerHTML = `<div class="earth-card-title">已加入哇声地球</div>
        <div class="earth-card-row">摇动竹蝉，让这里产生回响</div>`;
    }
    earthBottom.appendChild(card);
    const joinBtn = document.getElementById('earthJoinBtn');
    if(joinBtn) joinBtn.addEventListener('click', joinEarth);
    const retryBtn = document.getElementById('earthRetryBtn');
    if(retryBtn) retryBtn.addEventListener('click', () => { loadFailed = false; requestSnapshot(); updateBottomPanel(); });
  }

  // 加入哇声地球：定位 → cellID → PUT /api/players/me/earth
  async function joinEarth(){
    let lat, lon;
    try{
      const pos = await requestLocation();
      lat = pos.latitude; lon = pos.longitude;
    }catch(e){
      console.error('[Earth] joinEarth location failed:', e.message || e);
      showEarthError('无法获取位置', '请在系统设置中授予定位权限');
      return;
    }
    const cell = cellID(lat, lon);
    if(!cell){ showEarthError('位置无效', '无法计算所在区域'); return; }
    const id = await ensureIdentity();
    if(!id){ showEarthError('身份未就绪', '请检查网络后重试'); return; }
    try{
      // 服务端协议：{ enabled: true, cellID: "v1:..." }，必须带 enabled:true 否则返回 400
      const resp = await nativeFetch('PUT', API_BASE + '/api/players/me/earth',
        { 'Content-Type': 'application/json', ...authHeaders() },
        JSON.stringify({ enabled: true, cellID: cell }));
      if(resp.ok){
        meJoined = true;
        requestSnapshot();
        updateBottomPanel();
      }else{
        const errBody = await resp.text().catch(() => '');
        console.error('[Earth] join failed HTTP ' + resp.status + ':', errBody);
        showEarthError('加入失败', 'HTTP ' + resp.status + (errBody ? ' ' + errBody : ''));
      }
    }catch(e){
      showEarthError('网络错误', '请稍后重试');
    }
  }

  // 在地球底部面板显示错误卡片（ArkWeb 中 alert 可能不显示）
  function showEarthError(title, detail){
    earthBottom.innerHTML = '<div class="earth-card"><div class="earth-card-title">' + title + '</div>' +
      '<div class="earth-card-row">' + detail + '</div>' +
      '<button class="earth-retry" id="earthRetryBtn">重试</button></div>';
    const retryBtn = document.getElementById('earthRetryBtn');
    if(retryBtn) retryBtn.addEventListener('click', () => { loadFailed = false; updateBottomPanel(); });
  }

  // 渲染循环
  function loop(){
    if(!isOpen){ rafId = null; return; }
    const now = performance.now();
    const delta = lastFrameTime ? Math.min((now - lastFrameTime) / 1000, 0.05) : 0.016;
    lastFrameTime = now;
    // 自动旋转：3 秒无交互后开始，约 0.055 rad/s（与 iOS 一致）
    if(autoRotate && now - lastInteraction > 3000){
      rot.y += delta * 0.055;        // 0.055 rad/s，帧率无关
    }
    earth.rotation.x = rot.x;
    earth.rotation.y = rot.y;
    dotsGroup.rotation.x = rot.x;
    dotsGroup.rotation.y = rot.y;
    ripplesGroup.rotation.x = rot.x;
    ripplesGroup.rotation.y = rot.y;
    camera.position.set(0, 0, cameraDistance);
    camera.lookAt(0, 0, 0);

    // 共鸣波纹动画：2.8 秒周期
    const cycle = (now / 2800) % 1;
    for(const torus of rippleMeshes){
      if(!torus.visible) continue;
      const t = (cycle + torus.userData.phase) % 1;
      const scale = 1 + t * 8;
      torus.scale.set(scale, scale, 1);
      torus.material.opacity = (1 - t) * 0.6;
    }

    // detail 变化时 180ms 防抖后触发 earth_view 请求（与 iOS setDetail 一致）
    const detail = earthDetailForDistance(cameraDistance);
    if(detail !== lastDetail){
      lastDetail = detail;
      if(detailTimer) clearTimeout(detailTimer);
      detailTimer = setTimeout(() => {
        detailTimer = null;
        requestSnapshot();
      }, 180);
    }

    renderer.render(scene, camera);
    rafId = requestAnimationFrame(loop);
  }

  function open(){
    isOpen = true;
    if(window.__nativeBridge && window.__nativeBridge.notifyEarthState){
      try { window.__nativeBridge.notifyEarthState(true); } catch(e){}
    }
    resize();
    updateBottomPanel();
    requestSnapshot();
    if(!rafId) rafId = requestAnimationFrame(loop);
  }
  function close(){
    isOpen = false;
    if(window.__nativeBridge && window.__nativeBridge.notifyEarthState){
      try { window.__nativeBridge.notifyEarthState(false); } catch(e){}
    }
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    if(snapshotTimer){ clearTimeout(snapshotTimer); snapshotTimer = null; }
    if(revisionTimer){ clearTimeout(revisionTimer); revisionTimer = null; }
    if(detailTimer){ clearTimeout(detailTimer); detailTimer = null; }
  }

  // 暴露给 ArkTS 的拖拽接口（绕过 ArkWeb OSR 模式下 TouchMove 被拦截的问题）
  // ArkUI onTouch 回调的坐标单位为 vp，与 CSS px 1:1 对应
  window.__arkPanMove = function(dx, dy){
    if(!isOpen) return;
    lastInteraction = performance.now();
    rot.y += dx * 0.006;
    rot.x = clamp(rot.x + dy * 0.005, -Math.PI/2, Math.PI/2);
  };
  // 暴露给 ArkTS 的双指缩放接口（ratio = 当前双指距离 / 上次双指距离）
  window.__arkPinchMove = function(ratio){
    if(!isOpen) return;
    lastInteraction = performance.now();
    cameraDistance = clamp(cameraDistance / ratio, 1.72, 4.25);
  };

  // 事件绑定 —— Pointer Events（在 HarmonyOS ArkWeb 中比 Touch Events 更可靠）
  earthCanvas.addEventListener('pointerdown', onPointerDown);
  earthCanvas.addEventListener('pointermove', onPointerMove);
  earthCanvas.addEventListener('pointerup', onPointerUp);
  earthCanvas.addEventListener('pointercancel', onPointerCancel);
  // 鼠标滚轮缩放
  earthCanvas.addEventListener('wheel', e => {
    lastInteraction = performance.now();
    cameraDistance = clamp(cameraDistance + e.deltaY * 0.002, 1.72, 4.25);
  }, { passive: true });

  earthAutoBtn.addEventListener('click', e => {
    e.stopPropagation();
    autoRotate = !autoRotate;
    earthAutoBtn.textContent = autoRotate ? '自转开' : '自转关';
    earthAutoBtn.classList.toggle('on', autoRotate);
  });

  return { open, close, resize, requestSnapshot, requestSnapshotDebounced,
           get isOpen(){ return isOpen; } };
}

async function openEarthView(){
  earthOverlay.classList.add('open');
  earthBottom.innerHTML = '<div class="earth-card"><div class="earth-card-title">加载中</div></div>';
  const ev = await ensureEarthView();
  if(!ev){
    const hasBridge = !!window.__nativeBridge;
    const hasThree = !!window.THREE_EARTH;
    console.error('[Earth] openEarthView failed — bridge:', hasBridge, 'THREE_EARTH:', hasThree);
    earthBottom.innerHTML = '<div class="earth-card"><div class="earth-card-title">无法启动 3D</div>' +
      '<div class="earth-card-row">桥接: ' + (hasBridge ? '已注册' : '缺失') + '</div>' +
      '<div class="earth-card-row">THREE_EARTH: ' + (hasThree ? '已注入' : '未注入') + '</div>' +
      '<div class="earth-card-row">详见 hilog [Earth]</div></div>';
    return;
  }
  ev.open();
}
function closeEarthView(){
  earthOverlay.classList.remove('open');
  if(earthView) earthView.close();
}
document.getElementById('earthBtn').addEventListener('click', e => {
  e.stopPropagation();
  openEarthView();
});
document.getElementById('earthClose').addEventListener('click', closeEarthView);

// 地球视图随窗口大小变化
window.addEventListener('resize', () => {
  if(earthView && earthOverlay.classList.contains('open')) earthView.resize();
});

requestAnimationFrame(frame);
</script>
